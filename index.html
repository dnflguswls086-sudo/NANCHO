<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>난초반 만능툴</title>
<link rel="manifest" href="pc-manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="pc-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="pc-icon-512.png">
<meta name="theme-color" content="#6f9ee8">
<meta name="application-name" content="난초반 만능툴">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&display=swap');
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:linear-gradient(180deg,#a7d2ff 0%,#eef8ff 52%,#dff3e4 100%);
 font-family:"Gowun Dodum",sans-serif;color:#33475d;padding:20px
}
.shell{
 width:min(860px,94vw);background:rgba(255,255,255,.96);
 border-radius:34px;padding:30px;box-shadow:0 24px 70px rgba(55,84,120,.18);
 text-align:center;border:1px solid rgba(255,255,255,.8)
}
.hero{
 width:min(285px,55vw);aspect-ratio:1/1;object-fit:cover;
 border-radius:28%;display:block;margin:0 auto 12px;
 box-shadow:0 16px 35px rgba(74,107,142,.18)
}
h1{
 font:700 clamp(54px,7vw,82px)/.9 "Gaegu",cursive;
 margin:6px 0 4px;color:#354b65
}
.version{
 font:700 clamp(22px,2.4vw,30px) "Gaegu",cursive;
 color:#74859a;margin-bottom:24px
}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
a{
 text-decoration:none;border-radius:18px;padding:20px 16px;
 background:#eef4fb;color:#405a77;font-weight:900;font-size:18px;
 box-shadow:0 7px 16px rgba(57,84,116,.08);
 transition:.15s transform,.15s box-shadow
}
a:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(57,84,116,.13)}
a.teacher{background:#6f9ee8;color:#fff}
a.ipad{background:#61bb7b;color:#fff}
a.pin{background:#ffe08b;color:#614f15}
@media(max-width:640px){.grid{grid-template-columns:1fr}.shell{padding:22px}}
</style>
</head>
<body>
<div class="shell">
  <img class="hero" src="nancho-tool-icon.png" alt="난초반 만능툴 아이콘">
  <h1>난초반 만능툴</h1>
  <div class="version">2026-08-20 버전입니다 ^^*</div>

  <div class="grid">
    <a class="teacher" href="teacher.html">🧑‍🏫 교사용 관리</a>
    <a href="display.html">👀 학생용 큰 화면</a>
    <a class="ipad" href="check.html">📱 iPad 1인 1역 체크</a>
    <a class="pin" href="pins.html">🔐 학생 PIN 관리</a>
  </div>
</div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./pc-sw.js")
      .catch(err => console.log("PC PWA 서비스워커 등록 실패:", err));
  });
}
</script>
</body>
</html>
