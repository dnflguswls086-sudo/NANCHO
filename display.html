<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>난초반 학생용 SECTIONS</title><style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
:root{
 --ink:#32465f; --sub:#6e7f96; --line:#dbe7f1; --shadow:rgba(62,92,136,.14);
 --blue:#77a4ef; --blue2:#dcecff; --green:#dff6e6; --green2:#7dcb92;
 --pink:#edf3ff; --pink2:#bfd2ee; --yellow:#fff4ce; --lav:#efe7ff; --card:#ffffffee
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Gowun Dodum",sans-serif;color:var(--ink)}
body{
 background:
  radial-gradient(circle at 8% 10%, rgba(255,255,255,.65) 0 70px, transparent 71px),
  radial-gradient(circle at 95% 15%, rgba(244,248,255,.78) 0 88px, transparent 89px),
  radial-gradient(circle at 90% 85%, rgba(230,247,255,.85) 0 90px, transparent 91px),
  linear-gradient(180deg,#b8ddff 0%,#eff8ff 36%,#fffdf8 63%,#def4e2 100%);
}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.wrap{min-height:100vh;padding:12px}
.top{
 display:grid;grid-template-columns:1.25fr auto;gap:14px;align-items:center;
 padding:16px 18px;border-radius:28px;background:rgba(255,255,255,.78);
 backdrop-filter: blur(10px);box-shadow:0 16px 40px var(--shadow);border:1px solid rgba(255,255,255,.75)
}
.heroTitle{display:grid;gap:10px}
.title{
 font:400 clamp(62px,7.2vw,108px)/.9 "Jua",sans-serif;
 letter-spacing:-1px;color:#39547a
}
.subtitle{display:flex;flex-wrap:wrap;gap:8px}
.pill{
 padding:8px 14px;border-radius:999px;font:400 clamp(18px,1.5vw,24px) "Jua",sans-serif;
 background:#ffffff;border:1px solid #edf3fb;box-shadow:0 6px 16px rgba(62,92,136,.08)
}
.state{background:linear-gradient(180deg,#fff8d7,#ffeeb0);border-color:#efd97c}
.birthday{background:linear-gradient(180deg,#fff8df,#ffefb8);border-color:#ead37d}
.clock{
 text-align:right;padding:12px 16px;border-radius:22px;
 background:linear-gradient(180deg,#fefefe,#edf5ff);border:1px solid #e4ecf7
}
.date{font:400 clamp(24px,2vw,31px)/1.15 "Jua",sans-serif;color:#6f81a0}
.time{font:400 clamp(56px,6vw,92px)/1 "Jua",sans-serif;color:#46668f;margin-top:2px}

.mainlayout{display:grid;grid-template-columns:210px 1fr;gap:12px;margin-top:12px}
.navWrap{
 background:rgba(255,255,255,.73);backdrop-filter: blur(10px);
 border-radius:26px;padding:12px;box-shadow:0 14px 32px var(--shadow);border:1px solid rgba(255,255,255,.7)
}
.navTitle{
 font:400 clamp(20px,1.45vw,26px) "Jua",sans-serif;color:#6780a0;margin:2px 2px 10px;line-height:1.15;word-break:keep-all
}
.nav{display:grid;grid-template-columns:1fr;gap:8px}
.nav button{
 padding:11px 10px;border-radius:18px;background:rgba(255,255,255,.92);
 box-shadow:0 6px 16px rgba(62,92,136,.09);font:400 clamp(16px,1.2vw,21px) "Jua",sans-serif;
 text-align:left;white-space:normal;line-height:1.2;word-break:keep-all;transition:.16s transform,.16s background,.16s box-shadow
}
.nav button:hover{transform:translateY(-1px)}
.nav button.on{
 background:linear-gradient(135deg,#7ba6ef,#89c8ff);color:#fff;box-shadow:0 10px 18px rgba(76,121,190,.22)
}
.progressMini{
 margin-top:12px;border-radius:18px;padding:12px;background:linear-gradient(180deg,#f4fbff,#edf7f6);
 border:1px solid #deebf2
}
.progressMini h3{margin:0 0 8px;font:400 clamp(15px,1.05vw,18px) "Jua",sans-serif;color:#62809c;line-height:1.2;word-break:keep-all}
.miniStat{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:900;color:#5f7286;line-height:1.2}
.miniBar{margin-top:8px;height:12px;border-radius:999px;background:#dfeaf5;overflow:hidden}
.miniBar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#7ad28f,#8fd8ff)}

.page{
 background:rgba(255,255,255,.8);backdrop-filter: blur(10px);
 border-radius:28px;padding:14px;box-shadow:0 16px 38px var(--shadow);
 min-height:calc(100vh - 162px);border:1px solid rgba(255,255,255,.75)
}
.card{
 background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;
 box-shadow:0 8px 20px rgba(58,88,128,.08)
}
h2{
 margin:0 0 10px;font:400 clamp(39px,3.7vw,58px)/1 "Jua",sans-serif;color:#38567d
}
.section-home{display:grid;grid-template-columns:1.08fr .92fr;gap:12px}
.left,.right{display:grid;gap:12px;align-content:start}
.bigtext{
 min-height:180px;padding:18px 20px;border-radius:20px;white-space:pre-wrap;
 font:400 clamp(41px,4.1vw,68px)/1.12 "Jua",sans-serif
}
.notice{background:linear-gradient(180deg,#f7fbff,#eef6ff);border:2px dashed #bfd5ef;color:#4b6586}
.lunch{background:linear-gradient(180deg,#fffbed,#fff3ca);border:2px dashed #f0d37d;color:#795f24}
.lifebook{background:linear-gradient(180deg,#f5fff7,#e6faec);border:2px dashed #b8dfc4;color:#4a7058}
.todo,.events{display:grid;gap:8px}
.todoitem,.eventitem{
 padding:12px 14px;border-radius:16px;background:#f8fbff;border:1px solid #e5eef6;
 font-size:clamp(21px,2vw,30px);font-weight:900
}
.todoitem.done{text-decoration:line-through;background:#edf9f0;color:#738a7d}
.monthbirth{
 font:400 clamp(25px,2.5vw,38px)/1.5 "Jua",sans-serif;color:#5f7392
}
.section-activity{display:grid;grid-template-columns:.8fr .65fr .95fr;gap:12px;align-items:stretch}
.activitybox{
 padding:16px;border-radius:22px;background:linear-gradient(180deg,#f6f0ff,#efe6ff);
 border:2px solid #dbc8f3;text-align:center;min-height:250px;display:grid;place-items:center
}
.activitylabel{font:400 clamp(30px,2.9vw,42px) "Jua",sans-serif;color:#765e98}
.activityname{font:400 clamp(56px,5.5vw,82px)/1 "Jua",sans-serif;color:#594684;margin-top:8px}
.timerbox{
 display:grid;align-items:center;justify-items:center;
 background:linear-gradient(180deg,#f6fbff,#edf4ff)
}
.timerlabel{font:400 clamp(31px,3vw,44px) "Jua",sans-serif;color:#5d7e9f}
.timer{font:400 clamp(108px,12vw,188px)/.9 "Jua",sans-serif;color:#476b93;letter-spacing:-3px}
.tstate{font-size:17px;color:#75869a;font-weight:900}
.next,.lunchpromise{
 padding:18px;border-radius:22px;background:linear-gradient(180deg,#fff8de,#fff0c0);
 border:2px solid #ebd17b;font:400 clamp(34px,3.6vw,54px)/1.16 "Jua",sans-serif;color:#6f5926
}
.lunchpromise{background:linear-gradient(180deg,#fff3de,#ffe8bf)}
.small{display:block;margin-top:8px;font:900 14px "Gowun Dodum",sans-serif;color:#7a899a}

.rolegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rolecard{
 padding:13px;border-radius:22px;background:linear-gradient(180deg,#ffffff,#f6fbff);
 border:1px solid #dfe8f2
}
.rtitle{font:400 clamp(31px,2.8vw,42px) "Jua",sans-serif;color:#405e82}
.rperson{
 display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;
 padding:9px 11px;border-radius:14px;background:#f7fbff;border:1px solid #e6eef7;
 font:400 clamp(23px,2.15vw,32px) "Jua",sans-serif
}
.badge{padding:6px 10px;border-radius:999px;font-size:15px;font-weight:900}
.badge.done{background:#e4f7e9;color:#2e7d49}
.badge.wait{background:#fff1d8;color:#926c0e}

.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.scorecard{
 padding:14px;border-radius:22px;background:linear-gradient(180deg,#ffffff,#f7fbff);
 border:1px solid #dde8f2;text-align:center
}
.scorecard:nth-child(1){background:linear-gradient(180deg,#fff8de,#fff2be)}
.scorecard:nth-child(2){background:linear-gradient(180deg,#f4f8ff,#e8effa)}
.scorecard:nth-child(3){background:linear-gradient(180deg,#fff1ea,#ffe3d2)}
.scname{font:400 clamp(25px,2.3vw,34px)/1.2 "Jua",sans-serif}
.scnum{font:400 clamp(44px,4.2vw,64px)/1 "Jua",sans-serif;color:#48698f;margin:10px 0 6px}
.scmeta{font-size:15px;color:#6f8098;font-weight:900}

.donegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.donecard{padding:13px;border-radius:22px;border:2px solid #e4ebf4;background:#fff}
.donecard.ok{background:linear-gradient(180deg,#effbf2,#ddf4e5);border-color:#bfe2c9}
.donecard.no{background:linear-gradient(180deg,#fff9ee,#fff0d3);border-color:#efdba0}
.dname{font:400 clamp(27px,2.4vw,36px) "Jua",sans-serif}
.drole{margin-top:5px;font-size:16px;color:#6f8098;font-weight:900}
.dstatus{margin-top:10px;font:400 clamp(28px,2.6vw,40px) "Jua",sans-serif}

.seatpage{display:grid;gap:12px}
.board{
 text-align:center;padding:20px;border-radius:22px;background:linear-gradient(180deg,#50715f,#3a594a);
 color:#f1fff1;font:400 clamp(38px,3.2vw,50px) "Jua",sans-serif;letter-spacing:2px
}
.seats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.seat{
 border-radius:18px;padding:14px 10px;text-align:center;background:linear-gradient(180deg,#fff,#f7fbff);
 border:1px solid #deebf4;box-shadow:0 6px 14px rgba(58,88,128,.06)
}
.seatname{font:400 clamp(24px,2.05vw,30px) "Jua",sans-serif}
.seatrole{margin-top:6px;font-size:14px;color:#70839a;font-weight:900}

@media(max-width:1200px){
 .section-home{grid-template-columns:1fr}
 .section-activity{grid-template-columns:1fr}
 .scoregrid,.donegrid{grid-template-columns:repeat(3,1fr)}
 .rolegrid{grid-template-columns:repeat(2,1fr)}
 .seats{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:860px){
 .top{grid-template-columns:1fr}
 .mainlayout{grid-template-columns:1fr}
 .navWrap{position:static}
 .nav{grid-template-columns:repeat(2,1fr)}
 .nav button{text-align:center}
 .scoregrid,.donegrid{grid-template-columns:repeat(2,1fr)}
 .seats{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:620px){
 .wrap{padding:6px}
 .nav{grid-template-columns:1fr}
 .rolegrid,.scoregrid,.donegrid,.seats{grid-template-columns:1fr}
}
</style></head><body><div class="wrap" id="app"></div>
<script>
const STUDENTS = ["강승효", "김동윤", "김주원", "양지완", "이서준", "이영현", "이이안", "이지환", "이호진", "정민준", "정윤후", "하이준", "고서진", "김리재", "박나윤", "박서은", "송윤하", "이가빈", "임엘린", "정단우", "정이현", "조서윤", "최인아", "김나현"];
const ROLES = [{"name": "급식", "count": 4, "emoji": "🍱"}, {"name": "뒷정리 도우미", "count": 2, "emoji": "🧽"}, {"name": "시간표", "count": 1, "emoji": "🗓️"}, {"name": "태블릿(고정자리)", "count": 2, "emoji": "💻"}, {"name": "연필깎이", "count": 1, "emoji": "✏️"}, {"name": "에어컨담당", "count": 1, "emoji": "❄️"}, {"name": "공기청정기", "count": 1, "emoji": "🌿"}, {"name": "우유", "count": 2, "emoji": "🥛"}, {"name": "물티슈&휴지", "count": 1, "emoji": "🧻"}, {"name": "경기어린이", "count": 2, "emoji": "📰"}, {"name": "칠판지우기", "count": 1, "emoji": "🧹"}, {"name": "심부름", "count": 1, "emoji": "📨"}, {"name": "도서정리", "count": 1, "emoji": "📚"}, {"name": "일반시민", "count": 2, "emoji": "🙂"}, {"name": "문집정리", "count": 2, "emoji": "📘"}];
const KEY = "nancho-dual-master-plus-v1";
const PERIODS = [
 {label:"1교시",start:"08:40",end:"09:20"},
 {label:"2교시",start:"09:30",end:"10:10"},
 {label:"3교시",start:"10:20",end:"11:00"},
 {label:"4교시",start:"11:10",end:"11:50"},
 {label:"5교시",start:"12:00",end:"12:40"},
 {label:"6교시",start:"13:30",end:"14:10"},
 {label:"7교시",start:"14:20",end:"15:00"}
];
function fresh(){
 return {
  seats:[...STUDENTS],
  roleAssignments:Object.fromEntries(ROLES.map((r,i)=>[i,Array.from({length:r.count},()=>({name:"",done:false}))])),
  points:Object.fromEntries(STUDENTS.map(n=>[n,0])),
  warnings:Object.fromEntries(STUDENTS.map(n=>[n,0])),
  logs:Object.fromEntries(STUDENTS.map(n=>[n,[]])),
  roleReviews:Object.fromEntries(STUDENTS.map(n=>[n,[]])),
  studentPinHashes:{},
  checkHistory:[],
  birthdays:Object.fromEntries(STUDENTS.map(n=>[n,""])),
  morningNotice:"좋은 아침이에요!\\n가방 정리와 숙제 제출부터 시작해요 ☀️",
  lunch:"오늘의 급식을 입력해 주세요 🍱",
  lunchPromise:"모둠원들과만 이야기할 수 있어요 🤝",
  announcement:"오늘도 즐겁게 생활해요!\\n다음 시간 준비물을 꼭 확인하세요 🌸",
  lifeBookText:"생활본 작성할 친구는 쉬는시간에 차분히 적어주세요 ✏️",
  praise:{students:[],message:""},
  classState:"쉬는시간 🧸",
  events:[],
  todos:[{text:"아침 숙제 제출하기",done:false},{text:"다음 수업 준비물 챙기기",done:false}],
  timetable:PERIODS.map((p,i)=>({subject:["국어","수학","과학","사회","음악","체육","창체"][i]||""})),
  timer:{label:"쉬는시간",duration:600,remaining:600,running:false,lastTick:null}
 };
}
function load(){
 try{
  const raw=localStorage.getItem(KEY); if(!raw) return fresh();
  const x=JSON.parse(raw), b=fresh();
  Object.assign(b,x);
  STUDENTS.forEach(n=>{
    b.points[n]=Number(x.points?.[n]||0);
    b.warnings[n]=Number(x.warnings?.[n]||0);
    b.logs[n]=Array.isArray(x.logs?.[n])?x.logs[n]:[];
    b.roleReviews[n]=Array.isArray(x.roleReviews?.[n])?x.roleReviews[n]:[];
    b.birthdays[n]=String(x.birthdays?.[n]||"");
  });
  ROLES.forEach((r,i)=>{
    if(Array.isArray(x.roleAssignments?.[i])){
      b.roleAssignments[i]=Array.from({length:r.count},(_,j)=>{
        const it=x.roleAssignments[i][j];
        if(it && typeof it==="object") return {name:String(it.name||""),done:!!it.done};
        return {name:String(it||""),done:false};
      });
    }
  });
  if(!b.titleText) b.titleText="난초반 오늘";
  if(!b.praise || typeof b.praise!=="object") b.praise={students:[],message:""};
  if(!Array.isArray(b.praise.students)) b.praise.students=[];
  if(!Array.isArray(b.events)) b.events=[];
  return b;
 }catch(e){return fresh()}
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(S));
 try{localStorage.setItem(KEY+"-ping",String(Date.now()));}catch(e){}
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function roleOf(n){for(let i=0;i<ROLES.length;i++) if(S.roleAssignments[i].some(x=>x.name===n)) return ROLES[i].name; return "미배정";}
function roleAssigned(){return Object.values(S.roleAssignments).flat().map(x=>x.name).filter(Boolean).length;}
function roleDone(){return Object.values(S.roleAssignments).flat().filter(x=>x.done).length;}
function fmt(sec){sec=Math.max(0,Math.floor(sec||0));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;}
function timerSync(){
 if(S.timer.running && S.timer.lastTick){
  const diff=Math.floor((Date.now()-S.timer.lastTick)/1000);
  if(diff>0){
    S.timer.remaining=Math.max(0,S.timer.remaining-diff);
    S.timer.lastTick=Date.now();
    if(S.timer.remaining<=0){S.timer.running=false;S.timer.remaining=0;}
    save();
  }
 }
}
function hm(hm){const [h,m]=hm.split(":").map(Number);return h*60+m;}
function periodStatus(){
 const d=new Date(), now=d.getHours()*60+d.getMinutes();
 const lunchStart=12*60+30, lunchEnd=13*60+20;
 if(now>=lunchStart && now<=lunchEnd){
   return {
     current:{type:"lunch",label:"점심시간",start:"12:30",end:"13:20",subject:"점심시간"},
     next:{index:5,label:"6교시",start:"13:30",end:"14:10",subject:S.timetable?.[5]?.subject||""}
   };
 }
 let current=null,next=null;
 PERIODS.forEach((p,i)=>{
  if(now>=hm(p.start)&&now<=hm(p.end)) current={index:i,...p,subject:S.timetable?.[i]?.subject||""};
  if(!next && now<hm(p.start)) next={index:i,...p,subject:S.timetable?.[i]?.subject||""};
 });
 if(!next && current && PERIODS[current.index+1]){
   const i=current.index+1;
   next={index:i,...PERIODS[i],subject:S.timetable?.[i]?.subject||""};
 }
 return {current,next};
}
function todayBirthdays(){
 const d=new Date(), md=`${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 return STUDENTS.filter(n=>S.birthdays[n]===md);
}
function monthBirthdays(){
 const d=new Date(), mm=String(d.getMonth()+1).padStart(2,"0");
 return STUDENTS.filter(n=>String(S.birthdays[n]||"").startsWith(mm+"-"))
   .sort((a,b)=>S.birthdays[a].localeCompare(S.birthdays[b]));
}
let S=load(), interval=null, page="home";
function render(){
 timerSync();
 const ps=periodStatus(), bdays=todayBirthdays(), mb=monthBirthdays();
 const doneCount=roleDone(), assignedCount=Math.max(1,roleAssigned());
 const rate=Math.round((doneCount/assignedCount)*100);
 document.getElementById("app").innerHTML=`
 <div class="top">
   <div class="heroTitle">
     <div class="title">🌸 ${esc(S.titleText||"난초반 오늘")}</div>
     <div class="subtitle">
       <span class="pill state">🚦 ${esc(S.classState||"쉬는시간 🧸")}</span>
       ${bdays.length?`<span class="pill birthday">🎂 오늘 생일: ${bdays.map(esc).join(", ")}</span>`:''}
     </div>
   </div>
   <div class="clock">
     <div class="date">${new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"})}</div>
     <div class="time">${new Date().toLocaleTimeString("ko-KR",{hour12:false})}</div>
   </div>
 </div>
 <div class="mainlayout">
   <div class="navWrap">
     <div class="navTitle">학생용 메뉴</div>
     <div class="nav">
       ${navBtn("home","🏠 오늘의 안내")}
       ${navBtn("life","📝 생활본")}
       ${navBtn("activity","⏱️ 현재 활동")}
       ${navBtn("roles","🌈 1인 1역")}
       ${navBtn("scores","⭐ 점수표")}
       ${navBtn("done","✅ 역할 완료")}
       ${navBtn("seats","🪑 자리배치")}
     </div>
     <div class="progressMini">
       <h3>오늘의 진행 현황</h3>
       <div class="miniStat"><span>1인 1역 완료</span><strong>${doneCount} / ${assignedCount}</strong></div>
       <div class="miniBar"><span style="width:${rate}%"></span></div>
     </div>
   </div>
   <div class="page">${pageView(ps,mb)}</div>
 </div>`;
}
function navBtn(id,t){return `<button class="${page===id?'on':''}" onclick="page='${id}';render()">${t}</button>`}
function pageView(ps,mb){
 if(page==="life")return lifePage();
 if(page==="activity")return activityPage(ps);
 if(page==="roles")return rolesPage();
 if(page==="scores")return scoresPage();
 if(page==="done")return donePage();
 if(page==="seats")return seatsPage();
 return homePage(mb);
}

function homePage(mb){
 return `<div class="section-home">
   <div class="left">
     <div class="card">
       <h2>📢 안내사항</h2>
       <div class="bigtext notice">${esc(S.announcement||"")}</div>
     </div>
     <div class="card">
       <h2>🍱 오늘의 급식</h2>
       <div class="bigtext lunch">${esc(S.lunch||"")}</div>
     </div>
   </div>
   <div class="right">
     <div class="card">
       <h2>✅ 해야 할 일</h2>
       <div class="todo">${S.todos.length?S.todos.map(t=>`<div class="todoitem ${t.done?'done':''}">${t.done?'✅':'⬜'} ${esc(t.text)}</div>`).join(""):`<div class="todoitem">해야 할 일이 없어요 😊</div>`}</div>
     </div>
     <div class="card">
       <h2>🎂 이번 달 생일</h2>
       <div class="monthbirth">${mb.length?mb.map(n=>`${esc(S.birthdays[n].slice(3))}일 · ${esc(n)}`).join("<br>"):"이번 달 생일 등록 없음"}</div>
     </div>
     <div class="card">
       <h2>📅 오늘 일정</h2>
       <div class="events">${S.events.length?S.events.map(e=>`<div class="eventitem">🕒 ${esc(e.time||"")} ${esc(e.text||"")}</div>`).join(""):`<div class="eventitem">특별 일정이 없어요 😊</div>`}</div>
     </div>
   </div>
 </div>`;
}

function lifePage(){
 return `<div class="section-single section-life">
   <div class="card">
     <h2>📝 생활본 작성</h2>
     <div class="bigtext lifebook">${esc(S.lifeBookText||"")}</div>
   </div>
 </div>`;
}

function activityPage(ps){
 return `<div class="section-activity">
   <div class="card">
     <h2>📚 현재 활동</h2>
     <div class="activitybox">
       <div>
         <div class="activitylabel">지금 우리 반은</div>
         <div class="activityname">${esc(S.classState||"활동 중")}</div>
       </div>
     </div>
   </div>
   <div class="card timerbox">
     <div>
       <h2>⏱️ 타이머</h2>
       <div class="timerlabel">⏳ ${esc(S.timer.label||"타이머")}</div>
       <div class="timer">${fmt(S.timer.remaining)}</div>
       <div class="tstate">${S.timer.running?"진행 중":"대기 중"}</div>
     </div>
   </div>
   <div class="card nextwrap">
     <h2>${ps.current?.type==="lunch"?"🍱 점심시간 약속":"📘 다음 수업 안내"}</h2>
     ${ps.current?.type==="lunch"
       ? `<div class="lunchpromise">${esc(S.lunchPromise||"모둠원들과만 이야기할 수 있어요 🤝")}<span class="small">점심시간 12:30~13:20 · 다음은 6교시 ${esc(ps.next?.subject||"")} 13:30 시작</span></div>`
       : `<div class="next">${ps.current?`지금은 ${ps.current.label} ${esc(ps.current.subject||"")}`:(ps.next?`다음은 ${ps.next.label} ${esc(ps.next.subject||"")}`:"오늘 수업이 거의 끝났어요!")}<span class="small">${ps.next?`${ps.next.start} 시작`:""}</span></div>`}
   </div>
 </div>`;
}

function rolesPage(){
 return `<div><h2>🌈 1인 1역 확인</h2><div class="rolegrid">${ROLES.map((r,i)=>`<div class="rolecard"><div class="rtitle">${r.emoji} ${esc(r.name)}</div>${S.roleAssignments[i].map(x=>`<div class="rperson"><span>${esc(x.name||"미배정")}</span><span class="badge ${x.done?'done':'wait'}">${x.done?'완료 ✅':'미완료'}</span></div>`).join("")}</div>`).join("")}</div></div>`;
}

function scoresPage(){
 const ranked=[...STUDENTS].sort((a,b)=>Number(S.points[b]||0)-Number(S.points[a]||0));
 const medal=["🥇","🥈","🥉"];
 return `<div><h2>⭐ 오늘의 점수표</h2><div class="scoregrid">${ranked.map((n,i)=>`<div class="scorecard"><div class="scname">${medal[i]||`${i+1}.`} ${esc(n)}</div><div class="scnum">${Number(S.points[n]||0)}점</div><div class="scmeta">${esc(roleOf(n))}</div></div>`).join("")}</div></div>`;
}

function donePage(){
 return `<div><h2>✅ 1인 1역 완료 여부</h2><div class="donegrid">${STUDENTS.map(n=>{let role="미배정",done=false;for(let i=0;i<ROLES.length;i++){const slot=S.roleAssignments[i].find(x=>x.name===n);if(slot){role=ROLES[i].name;done=slot.done;break}}return `<div class="donecard ${done?'ok':'no'}"><div class="dname">${esc(n)}</div><div class="drole">${esc(role)}</div><div class="dstatus">${done?'✅ 완료':'⏳ 미완료'}</div></div>`}).join("")}</div></div>`;
}

function seatsPage(){
 return `<div><h2>🪑 난초반 자리배치표</h2><div class="seatpage"><div class="board">칠 판 · 선 생 님</div><div class="seats">${S.seats.map((n,i)=>`<div class="seat"><div class="seatname">${esc(n)}</div><div class="seatrole">${i+1}번 자리 · ${esc(roleOf(n))}</div></div>`).join("")}</div></div></div>`;
}
