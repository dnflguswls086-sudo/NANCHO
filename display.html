<script>
const DEFAULT_STUDENTS = ["강승효", "김동윤", "김주원", "양지완", "이서준", "이영현", "이이안", "이지환", "이호진", "정민준", "정윤후", "하이준", "고서진", "김리재", "박나윤", "박서은", "송윤하", "이가빈", "임엘린", "정단우", "정이현", "조서윤", "최인아", "김나현"];
const DEFAULT_ROLES = [{"name": "급식", "count": 4, "emoji": "🍱"}, {"name": "뒷정리 도우미", "count": 2, "emoji": "🧽"}, {"name": "시간표", "count": 1, "emoji": "🗓️"}, {"name": "태블릿(고정자리)", "count": 2, "emoji": "💻"}, {"name": "연필깎이", "count": 1, "emoji": "✏️"}, {"name": "에어컨담당", "count": 1, "emoji": "❄️"}, {"name": "공기청정기", "count": 1, "emoji": "🌿"}, {"name": "우유", "count": 2, "emoji": "🥛"}, {"name": "물티슈&휴지", "count": 1, "emoji": "🧻"}, {"name": "경기어린이", "count": 2, "emoji": "📰"}, {"name": "칠판지우기", "count": 1, "emoji": "🧹"}, {"name": "심부름", "count": 1, "emoji": "📨"}, {"name": "도서정리", "count": 1, "emoji": "📚"}, {"name": "일반시민", "count": 2, "emoji": "🙂"}, {"name": "문집정리", "count": 2, "emoji": "📘"}];
let STUDENTS=[...DEFAULT_STUDENTS];
let ROLES=DEFAULT_ROLES.map(r=>({...r}));
const KEY = "nancho-dual-master-plus-v1";
const PERIODS = [
 {label:"1교시",start:"08:40",end:"09:20"},
 {label:"2교시",start:"09:30",end:"10:10"},
 {label:"3교시",start:"10:20",end:"11:00"},
 {label:"4교시",start:"11:10",end:"11:50"},
 {label:"5교시",start:"12:00",end:"12:40"},
 {label:"6교시",start:"13:30",end:"14:10"},
 {label:"7교시",start:"14:20",end:"15:00"}
];
function fresh(){
 return {
  classConfig:{schoolYear:2026,grade:5,className:"난초반"},
  students:STUDENTS.map((name,i)=>({id:`student-${String(i+1).padStart(3,"0")}`,name,active:true})),
  roles:ROLES.map(r=>({...r})),
  seats:[...STUDENTS],
  roleAssignments:Object.fromEntries(ROLES.map((r,i)=>[i,Array.from({length:r.count},()=>({name:"",done:false}))])),
  points:Object.fromEntries(STUDENTS.map(n=>[n,0])),
  warnings:Object.fromEntries(STUDENTS.map(n=>[n,0])),
  logs:Object.fromEntries(STUDENTS.map(n=>[n,[]])),
  roleReviews:Object.fromEntries(STUDENTS.map(n=>[n,[]])),
  studentPinHashes:{},
  checkHistory:[],
  birthdays:Object.fromEntries(STUDENTS.map(n=>[n,""])),
  morningNotice:"좋은 아침이에요!\\n가방 정리와 숙제 제출부터 시작해요 ☀️",
  lunch:"오늘의 급식을 입력해 주세요 🍱",
  lunchPromise:"모둠원들과만 이야기할 수 있어요 🤝",
  announcement:"오늘도 즐겁게 생활해요!\\n다음 시간 준비물을 꼭 확인하세요 🌸",
  lifeBookText:"생활본 작성할 친구는 쉬는시간에 차분히 적어주세요 ✏️",
  praise:{students:[],message:""},
  classState:"쉬는시간 🧸",
  events:[],
  todos:[{text:"아침 숙제 제출하기",done:false},{text:"다음 수업 준비물 챙기기",done:false}],
  timetable:PERIODS.map((p,i)=>({subject:["국어","수학","과학","사회","음악","체육","창체"][i]||""})),
  timer:{label:"쉬는시간",duration:600,remaining:600,running:false,lastTick:null,endAt:null}
 };
}
function load(){
 try{
  const raw=localStorage.getItem(KEY); if(!raw) return fresh();
  const x=JSON.parse(raw);
  if(Array.isArray(x.students)&&x.students.length){
    const active=x.students.filter(s=>s?.active!==false).map(s=>String(s?.name||"").trim()).filter(Boolean);
    if(active.length)STUDENTS=active;
  }else if(Array.isArray(x.seats)&&x.seats.length){
    STUDENTS=[...new Set(x.seats.map(n=>String(n||"").trim()).filter(Boolean))];
  }
  if(Array.isArray(x.roles)&&x.roles.length){
    ROLES=x.roles.map((r,i)=>({id:r?.id||`role-${i+1}`,name:String(r?.name||`역할 ${i+1}`),count:Math.max(1,Number(r?.count||1)),emoji:String(r?.emoji||"🌱")}));
  }
  const b=fresh();
  Object.assign(b,x);
  STUDENTS.forEach(n=>{
    b.points[n]=Number(x.points?.[n]||0);
    b.warnings[n]=Number(x.warnings?.[n]||0);
    b.logs[n]=Array.isArray(x.logs?.[n])?x.logs[n]:[];
    b.roleReviews[n]=Array.isArray(x.roleReviews?.[n])?x.roleReviews[n]:[];
    b.birthdays[n]=String(x.birthdays?.[n]||"");
  });
  ROLES.forEach((r,i)=>{
    if(Array.isArray(x.roleAssignments?.[i])){
      b.roleAssignments[i]=Array.from({length:r.count},(_,j)=>{
        const it=x.roleAssignments[i][j];
        if(it && typeof it==="object") return {name:String(it.name||""),done:!!it.done};
        return {name:String(it||""),done:false};
      });
    }
  });
  if(!b.titleText) b.titleText="난초반 오늘";
  if(!b.praise || typeof b.praise!=="object") b.praise={students:[],message:""};
  if(!Array.isArray(b.praise.students)) b.praise.students=[];
  if(!Array.isArray(b.events)) b.events=[];
  return b;
 }catch(e){return fresh()}
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(S));
 try{localStorage.setItem(KEY+"-ping",String(Date.now()));}catch(e){}
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function roleOf(n){for(let i=0;i<ROLES.length;i++) if(S.roleAssignments[i].some(x=>x.name===n)) return ROLES[i].name; return "미배정";}
function roleAssigned(){return Object.values(S.roleAssignments).flat().map(x=>x.name).filter(Boolean).length;}
function roleDone(){return Object.values(S.roleAssignments).flat().filter(x=>x.done).length;}
function fmt(sec){sec=Math.max(0,Math.floor(sec||0));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;}
function timerSync(){
 if(!S.timer)return;
 if(S.timer.running){
   if(S.timer.endAt){
     S.timer.remaining=Math.max(0,Math.ceil((Number(S.timer.endAt)-Date.now())/1000));
   }else if(S.timer.lastTick){
     const diff=Math.max(0,Math.floor((Date.now()-Number(S.timer.lastTick))/1000));
     S.timer.remaining=Math.max(0,Number(S.timer.remaining||0)-diff);
   }
   if(S.timer.remaining<=0){
     S.timer.remaining=0;
     S.timer.running=false;
   }
 }
}
function hm(hm){const [h,m]=hm.split(":").map(Number);return h*60+m;}
function periodStatus(){
 const d=new Date(), now=d.getHours()*60+d.getMinutes();
 const lunchStart=12*60+30, lunchEnd=13*60+20;
 if(now>=lunchStart && now<=lunchEnd){
   return {
     current:{type:"lunch",label:"점심시간",start:"12:30",end:"13:20",subject:"점심시간"},
     next:{index:5,label:"6교시",start:"13:30",end:"14:10",subject:S.timetable?.[5]?.subject||""}
   };
 }
 let current=null,next=null;
 PERIODS.forEach((p,i)=>{
  if(now>=hm(p.start)&&now<=hm(p.end)) current={index:i,...p,subject:S.timetable?.[i]?.subject||""};
  if(!next && now<hm(p.start)) next={index:i,...p,subject:S.timetable?.[i]?.subject||""};
 });
 if(!next && current && PERIODS[current.index+1]){
   const i=current.index+1;
   next={index:i,...PERIODS[i],subject:S.timetable?.[i]?.subject||""};
 }
 return {current,next};
}
function todayBirthdays(){
 const d=new Date(), md=`${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 return STUDENTS.filter(n=>S.birthdays[n]===md);
}
function monthBirthdays(){
 const d=new Date(), mm=String(d.getMonth()+1).padStart(2,"0");
 return STUDENTS.filter(n=>String(S.birthdays[n]||"").startsWith(mm+"-"))
   .sort((a,b)=>S.birthdays[a].localeCompare(S.birthdays[b]));
}
let S=load(), interval=null, page="home";
let rgGame="sticks",rgSelected=new Set(),rgExcluded=new Set(),rgExcludePicked=true;
let rgSticks=[],rgBalloons=[],rgLadder=null,rgMessage="";

 timerSync();

 const doneCount=roleDone(), assignedCount=Math.max(1,roleAssigned());
 const rate=Math.round((doneCount/assignedCount)*100);
 document.getElementById("app").innerHTML=`
 <div class="top">

       <h3>오늘의 진행 현황</h3>
       <div class="miniStat"><span>1인 1역 완료</span><strong>${doneCount} / ${assignedCount}</strong></div>
       <div class="miniBar"><span style="width:${rate}%"></span></div>
     </div>

 </div>`;
}
function navBtn(id,t){return `<button class="${page===id?'on':''}" onclick="page='${id}';render()">${t}</button>`}
function pageView(ps,mb){
 if(page==="life")return lifePage();
 if(page==="activity")return activityPage(ps);
 if(page==="roles")return rolesPage();
 if(page==="scores")return scoresPage();
 if(page==="done")return donePage();
 if(page==="seats")return seatsPage();
 if(page==="random")return randomPage();
 return homePage(mb);
}

function rgSync(){const valid=new Set(STUDENTS);rgSelected=new Set([...rgSelected].filter(n=>valid.has(n)));rgExcluded=new Set([...rgExcluded].filter(n=>valid.has(n)));if(!rgSelected.size)STUDENTS.forEach(n=>rgSelected.add(n))}
function rgActive(){rgSync();return STUDENTS.filter(n=>rgSelected.has(n)&&!rgExcluded.has(n))}
function rgShuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rgClear(){rgSticks=[];rgBalloons=[];rgLadder=null}
function randomPage(){rgSync();const active=rgActive();return `<div class="randomWrap">
<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2>🎲 랜덤뽑기</h2><div class="randomGameTabs">${rgBtn("sticks","🥢 막대기 뽑기")}${rgBtn("ladder","🪜 사다리타기")}${rgBtn("balloon","🎈 풍선 터트리기")}</div></div><div class="randomControls"><button onclick="rgExcludePicked=!rgExcludePicked;render()">${rgExcludePicked?"✅":"⬜"} 뽑힌 학생 제외</button><button onclick="rgReset()">🔄 초기화</button></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><b>참가 학생 ${active.length}명</b><div class="randomControls"><button onclick="rgAll(true)">전체 선택</button><button onclick="rgAll(false)">전체 해제</button><button onclick="rgExcluded.clear();rgClear();render()">제외 복귀</button></div></div><div class="randomRoster2" style="margin-top:10px">${STUDENTS.map(n=>`<button class="${rgSelected.has(n)?'on':''} ${rgExcluded.has(n)?'ex':''}" onclick="rgToggle('${n}')">${esc(n)}</button>`).join("")}</div></div>
<div class="randomStage2">${rgGameView(active)}</div><div class="randomResult2">${rgMessage||"하나 골라볼까요? 😊"}</div></div>`}
function rgBtn(id,t){return `<button class="${rgGame===id?'on':''}" onclick="rgGame='${id}';rgMessage='';rgClear();render()">${t}</button>`}
function rgToggle(n){rgSelected.has(n)?rgSelected.delete(n):rgSelected.add(n);rgExcluded.delete(n);rgMessage="";rgClear();render()}
function rgAll(v){rgSelected=new Set(v?STUDENTS:[]);rgExcluded.clear();rgMessage="";rgClear();render()}
function rgReset(){rgSelected=new Set(STUDENTS);rgExcluded.clear();rgExcludePicked=true;rgMessage="";rgClear();render()}
function rgGameView(a){if(!a.length)return `<div class="randomHint">참가할 학생을 선택해 주세요.</div>`;return rgGame==="ladder"?rgLadderView(a):rgGame==="balloon"?rgBalloonView(a):rgStickView(a)}
function rgStickView(a){const k=[...a].sort().join("|");if(rgSticks._key!==k){rgSticks=rgShuffle(a).map(name=>({name,revealed:false}));rgSticks._key=k}return `<div class="randomHint">막대기 하나를 골라 주세요!</div><div class="stickGrid2">${rgSticks.map((s,i)=>`<div class="stick2 ${s.revealed?'revealed':''}" onclick="rgPickStick(${i})"><span>${s.revealed?esc(s.name):"?"}</span></div>`).join("")}</div>`}
function rgPickStick(i){const s=rgSticks[i];if(!s||s.revealed)return;s.revealed=true;rgMessage=`🥢 ${s.name} 당첨!`;if(rgExcludePicked)rgExcluded.add(s.name);render()}
const RG_COLORS=["#ffd8d8","#ffe4b8","#dcf0bd","#d2e9ff","#ddd9ff","#cfeee8"];
function rgBalloonView(a){const k=[...a].sort().join("|");if(rgBalloons._key!==k){rgBalloons=rgShuffle(a).map((name,i)=>({name,popped:false,color:RG_COLORS[i%RG_COLORS.length]}));rgBalloons._key=k}return `<div class="randomHint">마음에 드는 풍선을 터뜨려 보세요!</div><div class="balloonGrid2">${rgBalloons.map((b,i)=>`<button class="balloon2 ${b.popped?'popped':''}" style="background:${b.color}" onclick="rgPop(${i})">${b.popped?`💥<br>${esc(b.name)}`:"🎈"}</button>`).join("")}</div>`}
function rgPop(i){const b=rgBalloons[i];if(!b||b.popped)return;b.popped=true;rgMessage=`🎈 ${b.name} 당첨!`;if(rgExcludePicked)rgExcluded.add(b.name);render()}
function rgBuildLadder(a){const names=rgShuffle(a),n=names.length,rows=Math.max(8,Math.min(14,n+4)),rungs=[];for(let r=0;r<rows;r++){let c=Math.floor(Math.random()*2);while(c<n-1){if(Math.random()<.5){rungs.push({row:r,col:c});c+=2}else c++}}rgLadder={key:[...a].sort().join("|"),names,rows,rungs,winnerBottom:Math.floor(Math.random()*n),path:null}}
function rgLadderPath(start){const n=rgLadder.names.length,x=c=>40+c*920/(n-1),y=r=>20+r*240/rgLadder.rows;let col=start,pts=[[x(col),0],[x(col),20]];for(let r=0;r<rgLadder.rows;r++){const yy=y(r+.5);pts.push([x(col),yy]);const l=rgLadder.rungs.some(a=>a.row===r&&a.col===col-1),rr=rgLadder.rungs.some(a=>a.row===r&&a.col===col);if(l){col--;pts.push([x(col),yy])}else if(rr){col++;pts.push([x(col),yy])}}pts.push([x(col),280]);return {points:pts.map(p=>p.join(",")).join(" "),end:col}}
function rgLadderView(a){const k=[...a].sort().join("|");if(!rgLadder||rgLadder.key!==k)rgBuildLadder(a);const n=rgLadder.names.length;if(n===1)return `<div class="randomResult2">🎉 ${esc(a[0])}</div>`;const width=Math.max(760,n*78),cols=`repeat(${n},1fr)`,x=c=>40+c*920/(n-1);let lines="",rungs="";for(let c=0;c<n;c++)lines+=`<line class="ladderLine2" x1="${x(c)}" y1="0" x2="${x(c)}" y2="280"/>`;rgLadder.rungs.forEach(a=>{const yy=20+(a.row+.5)*240/rgLadder.rows;rungs+=`<line class="ladderRung2" x1="${x(a.col)}" y1="${yy}" x2="${x(a.col+1)}" y2="${yy}"/>`});const path=rgLadder.path?`<polyline class="ladderPath2" points="${rgLadder.path}"/>`:"";return `<div class="randomHint">이름을 눌러 사다리를 출발시켜 보세요!</div><div class="ladderScroll2"><div class="ladderBoard2" style="width:${width}px"><div class="ladderNames2" style="grid-template-columns:${cols}">${rgLadder.names.map((n,i)=>`<button onclick="rgRun(${i})">${esc(n)}</button>`).join("")}</div><svg class="ladderSvg2" viewBox="0 0 1000 280" preserveAspectRatio="none">${lines}${rungs}${path}</svg><div class="ladderBottom2" style="grid-template-columns:${cols}">${rgLadder.names.map((_,i)=>`<div>${i===rgLadder.winnerBottom?"🎉 당첨":"○"}</div>`).join("")}</div></div></div>`}
function rgRun(i){const r=rgLadderPath(i),name=rgLadder.names[i],win=r.end===rgLadder.winnerBottom;rgLadder.path=r.points;rgMessage=win?`🎉 ${name} 당첨!`:`🙂 ${name}은(는) 이번엔 통과!`;if(win&&rgExcludePicked)rgExcluded.add(name);render()}


let lastRenderedDateKey="";
function lightTick(){
 // 전체 화면을 다시 만들지 않고 시계/타이머 숫자만 갱신합니다.
 const now=new Date();
 const clock=document.getElementById("liveClock");
 if(clock)clock.textContent=now.toLocaleTimeString("ko-KR",{hour12:false});

 const date=document.getElementById("liveDate");
 const dateKey=`${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
 if(date && lastRenderedDateKey!==dateKey){
   date.textContent=now.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
   lastRenderedDateKey=dateKey;
 }

 if(S?.timer?.running){
   if(S.timer.endAt){
     S.timer.remaining=Math.max(0,Math.ceil((Number(S.timer.endAt)-Date.now())/1000));
   }else if(S.timer.lastTick){
     const diff=Math.max(0,Math.floor((Date.now()-Number(S.timer.lastTick))/1000));
     S.timer.remaining=Math.max(0,Number(S.timer.remaining||0)-diff);
   }
   if(S.timer.remaining<=0){
     S.timer.remaining=0;
     S.timer.running=false;
   }
 }

 const timer=document.getElementById("liveTimer");
 if(timer)timer.textContent=fmt(S?.timer?.remaining||0);
 const state=document.getElementById("liveTimerState");
 if(state)state.textContent=S?.timer?.running?"진행 중":"대기 중";
}

window.addEventListener("nancho-cloud-update",()=>{S=load();render()});

render();
lightTick();
interval=setInterval(lightTick,250);
</script>
